worker_processes 1;
pid /tmp/gigbid/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  access_log off;
  client_body_temp_path /tmp/gigbid/nginx/body;
  proxy_temp_path /tmp/gigbid/nginx/proxy;
  fastcgi_temp_path /tmp/gigbid/nginx/fastcgi;
  uwsgi_temp_path /tmp/gigbid/nginx/uwsgi;
  scgi_temp_path /tmp/gigbid/nginx/scgi;
  client_max_body_size 6m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 7860;
    # API, including SSE (no buffering so node events stream live)
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
    }
    location = /docs { proxy_pass http://127.0.0.1:8000/docs; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }
    # Phoenix trace UI (PHOENIX_HOST_ROOT_PATH=/phoenix); read-only for reviewers, PII masked before export
    location /phoenix/ {
      proxy_pass http://127.0.0.1:6006/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
