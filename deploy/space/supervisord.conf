[supervisord]
nodaemon=true
logfile=/tmp/gigbid/logs/supervisord.log
pidfile=/tmp/gigbid/supervisord.pid
childlogdir=/tmp/gigbid/logs

[unix_http_server]
file=/tmp/gigbid/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/gigbid/supervisor.sock

[program:postgres]
command=bash -c 'exec "$PGBIN/postgres" -D /tmp/gigbid/pg -k /tmp -h 127.0.0.1 -p 5432'
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --port 6379 --bind 127.0.0.1 --dir /tmp/gigbid/redis --save "" --appendonly no
priority=1
autorestart=true

[program:phoenix]
command=/opt/phoenix/bin/phoenix serve
priority=2
autorestart=true

[program:gigsim]
command=uvicorn gigsim.app:app --host 127.0.0.1 --port 8081 --log-level warning
directory=/app
priority=3
autorestart=true

[program:mcp_portfolio]
command=python -m mcp_servers.portfolio.server --http
directory=/app
environment=MCP_HOST="127.0.0.1"
priority=4
autorestart=true

[program:mcp_marketplace]
command=bash -c 'sleep 4 && exec python -m mcp_servers.marketplace.server'
directory=/app
environment=MCP_HOST="127.0.0.1"
priority=4
autorestart=true

[program:mcp_workspace]
command=bash -c 'sleep 4 && exec python -m mcp_servers.workspace.server'
directory=/app
environment=MCP_HOST="127.0.0.1"
priority=4
autorestart=true

[program:api]
command=bash -c 'sleep 6 && exec uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips="*"'
directory=/app
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=bash -c 'sleep 12 && exec arq worker.main.WorkerSettings'
directory=/app
priority=6
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=node server.js
directory=/web
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
priority=6
autorestart=true

[program:nginx]
command=nginx -e /dev/stderr -c /etc/gigbid/nginx.conf -g "daemon off;"
priority=7
autorestart=true
