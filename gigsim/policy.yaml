# GigSim platform policy. GigSim serves the active version at GET /v1/policy and enforces it.
#
# NOTE: the course did not ship an official GigSim or change-request text, so this repository's GigSim
# carries a SELF-DEFINED "platform policy update" dated 2026-11-02 (see docs/CHANGE_REQUEST.md).
# GIGSIM_POLICY_VERSION selects which version is enforced; the default is the latest.

versions:
  "2026-10-27":
    connects:
      weekly_allowance: 80
      surcharge_rules: []
    proposal:
      max_cover_letter_chars: null
    rate_limit_per_minute: 60
  "2026-11-02":
    summary: >
      Platform policy update. (1) High-value jobs cost more to bid on: proposals to jobs with a fixed budget
      of at least $1,000 or an hourly ceiling of at least $50 cost 1.5x the listed Connects, rounded up.
      (2) Cover letters longer than 1,500 characters are rejected at submission.
    connects:
      weekly_allowance: 80
      surcharge_rules:
        - name: high_value_job
          when: {min_fixed_budget: 1000, min_hourly_high: 50}
          multiplier: 1.5
    proposal:
      max_cover_letter_chars: 1500
    rate_limit_per_minute: 60
