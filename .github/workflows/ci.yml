name: CI
on: [push, pull_request]

jobs:
  python:
    name: lint, unit, contract, repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.7"}
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Repository rules (no secrets, frozen GigSim, prompts in agent/prompts, README numbers trace to results)
        run: uv run python -m scripts.ci_checks
      - name: Unit + MCP server tests (in-memory MCP client)
        run: uv run pytest -q tests/unit mcp_servers
      - name: Contract tests (MCP tool-schema snapshots)
        run: uv run pytest -q tests/contract
      - name: Live-adapter test against a mock Upwork MCP server
        run: uv run pytest -q tests/integration/test_upwork_adapter.py

  web:
    name: typecheck, build, Playwright
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - name: Generated client is up to date with the OpenAPI schema
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright (onboarding, approve, reject with reason, edit, degraded banner, keyboard)
        run: npx playwright test --project=desktop --project=phone
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
