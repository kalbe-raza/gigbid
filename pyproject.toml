[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016, Syed Kalbe Raza 22i-0794)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "pydantic-settings",
  "pyyaml",
  "httpx",
  "sse-starlette",
  "python-multipart",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langgraph-supervisor",
  "langchain-core",
  "langchain-openai",
  "langchain-mcp-adapters",
  "mcp",
  "psycopg[binary,pool]",
  "redis",
  "arq",
  "qdrant-client",
  "fastembed",
  "rank-bm25",
  "pypdf",
  "reportlab",
  "cryptography",
  "pyjwt",
  "bcrypt",
  "numpy",
  "arize-phoenix-otel",
  "openinference-instrumentation-langchain",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "pandas", "openpyxl"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag", "mcp_servers", "apps", "worker", "gigsim", "evals"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps/web", "gigsim"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
markers = ["integration: needs running GigSim / services", "live: hits real LLM providers"]
